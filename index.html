<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RajRebel Creations | AI Prompt & Creator Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .masonry-grid {
            column-count: 2;
            column-gap: 0.75rem;
        }
        @media (min-width: 768px) {
            .masonry-grid { column-count: 3; }
        }
        @media (min-width: 1024px) {
            .masonry-grid { column-count: 4; }
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- 1. Profile & Social Media Buttons Header -->
    <header class="py-4 px-4 bg-gray-900 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=150" alt="Profile" class="w-11 h-11 rounded-full border-2 border-yellow-400 object-cover">
            <div>
                <h1 class="text-sm font-bold text-yellow-400">RajRebel Creations</h1>
                <p class="text-[11px] text-gray-400">@RajRebel_Creations</p>
            </div>
        </div>
        <!-- Social Media Buttons -->
        <div class="flex items-center gap-2">
            <a href="https://youtube.com" target="_blank" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                🔴 YouTube
            </a>
            <a href="https://whatsapp.com" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                💬 WhatsApp
            </a>
            <a href="https://instagram.com" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                📸 Instagram
            </a>
        </div>
    </header>

    <!-- 2. Banner Section -->
    <div class="w-full h-40 md:h-52 bg-gray-900 relative overflow-hidden border-b border-gray-800">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200" alt="Banner" class="w-full h-full object-cover opacity-70">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent flex items-end p-4">
            <div>
                <h2 class="text-base md:text-lg font-bold text-white">Welcome to My AI Hub</h2>
                <p class="text-xs text-gray-300">Best AI Prompts, Birthday Wishes & Mobile Tricks</p>
            </div>
        </div>
    </div>

    <!-- 3. Search Bar -->
    <div class="max-w-4xl mx-auto p-4">
        <div class="relative">
            <input type="text" id="searchInput" onkeyup="filterPrompts()" placeholder="Search prompts, birthday wishes, couple looks, tricks..." class="w-full bg-gray-900 border border-gray-800 rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-yellow-400">
            <span class="absolute right-4 top-3.5 text-gray-400">🔍</span>
        </div>
    </div>

    <!-- 4. Categories Filter Buttons -->
    <div class="max-w-7xl mx-auto px-4 overflow-x-auto whitespace-nowrap pb-2 flex gap-2 scrollbar-none">
        <button onclick="filterCategory('all')" class="cat-btn bg-yellow-500 text-gray-950 text-xs font-bold px-4 py-2 rounded-full transition">All</button>
        <button onclick="filterCategory('birthday')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">🎂 Birthday Wishes</button>
        <button onclick="filterCategory('couple')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">💑 Couple Prompts</button>
        <button onclick="filterCategory('girls')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">✨ Girl Prompts</button>
        <button onclick="filterCategory('boys')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">😎 Boy Prompts</button>
        <button onclick="filterCategory('photos')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">🖼️ AI Photo Prompts</button>
        <button onclick="filterCategory('videos')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">🎥 AI Video Prompts</button>
        <button onclick="filterCategory('tricks')" class="cat-btn bg-gray-900 text-gray-300 text-xs font-semibold px-4 py-2 rounded-full border border-gray-800 transition">📱 Mobile Tricks</button>
    </div>

    <!-- 5. Content Gallery Grid -->
    <main class="max-w-7xl mx-auto p-4">
        <div class="masonry-grid" id="galleryGrid">
            
            <!-- Card 1: Birthday -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="birthday" data-title="Birthday Poster Wish" onclick="openModal('https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=600', 'A grand 3D birthday celebration poster with glowing neon text Happy Birthday, colorful balloons, cinematic lighting, 8k resolution.')">
                <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=600" alt="Birthday" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">🎂 Birthday Wishes</span>
                </div>
            </div>

            <!-- Card 2: Couple -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="couple" data-title="Couple Prompt Black Jacket" onclick="openModal('https://images.unsplash.com/photo-1621184455862-c163dfb30e0f?q=80&w=600', 'Realistic portrait of a stylish young couple wearing matching black jackets and yellow t-shirts, outdoor modern background, 8k.')">
                <img src="https://images.unsplash.com/photo-1621184455862-c163dfb30e0f?q=80&w=600" alt="Couple" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">💑 Couple Prompts</span>
                </div>
            </div>

            <!-- Card 3: Girls -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="girls" data-title="Girl Prompt Beautiful Portrait" onclick="openModal('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600', 'Stunning cinematic portrait of an Indian girl with traditional earrings, soft natural lighting, beautiful bokeh background, 8k.')">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600" alt="Girl" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">✨ Girl Prompts</span>
                </div>
            </div>

            <!-- Card 4: Boys -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="boys" data-title="Boy Prompt Stylish Attitude" onclick="openModal('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=600', 'Handsome young man with stylish haircut and black outfit, moody cinematic dark background, highly detailed prompt.')">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=600" alt="Boy" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">😎 Boy Prompts</span>
                </div>
            </div>

            <!-- Card 5: AI Photos -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="photos" data-title="AI Photo Cyberpunk Portrait" onclick="openModal('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600', 'A futuristic cyberpunk portrait of a warrior with neon glowing details, highly detailed, 8k resolution, cinematic lighting.')">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600" alt="AI Photo" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">🖼️ AI Photo Prompts</span>
                </div>
            </div>

            <!-- Card 6: AI Videos -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="videos" data-title="AI Video Animation Prompt" onclick="openModal('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=600', 'Dynamic camera movement flying through a glowing neon futuristic city tunnel, 4k 60fps video prompt for Runway/Luma/Sora.')">
                <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=600" alt="AI Video" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">🎥 AI Video Prompts</span>
                </div>
            </div>

            <!-- Card 7: Mobile Tricks -->
            <div class="masonry-item card-item relative group cursor-pointer overflow-hidden rounded-xl bg-gray-900 border border-gray-800" data-category="tricks" data-title="Mobile Secret Trick Settings" onclick="openModal('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=600', 'Secret Android and iPhone hidden developer settings guide to speed up mobile performance and save battery life instantly.')">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=600" alt="Mobile Trick" class="w-full object-cover rounded-xl transition duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-3">
                    <span class="text-xs text-yellow-400 font-semibold">📱 Mobile Tricks</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Popup for Copying Prompt -->
    <div id="promptModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-4 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl font-bold bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center">&times;</button>
            
            <img id="modalImg" src="" alt="Preview" class="w-full h-56 object-cover rounded-xl mb-4">
            
            <h3 class="text-sm font-semibold text-gray-400 mb-1">Prompt / Description:</h3>
            <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 text-sm text-gray-200 mb-4 select-all" id="modalPromptText"></div>
            
            <button onclick="copyPrompt()" id="copyBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2">
                Copy Prompt
            </button>
        </div>
    </div>

    <!-- JavaScript for Category Filter, Search & Copy -->
    <script>
        let currentPrompt = "";

        function openModal(imgSrc, promptText) {
            currentPrompt = promptText;
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalPromptText').innerText = promptText;
            document.getElementById('promptModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('promptModal').classList.add('hidden');
        }

        function copyPrompt() {
            navigator.clipboard.writeText(currentPrompt).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "Copied Successfully! 🎉";
                btn.classList.remove('bg-yellow-500');
                btn.classList.add('bg-green-600', 'text-white');
                setTimeout(() => {
                    btn.innerText = "Copy Prompt";
                    btn.classList.remove('bg-green-600', 'text-white');
                    btn.classList.add('bg-yellow-500');
                }, 2000);
            });
        }

        function filterCategory(category) {
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-yellow-500', 'text-gray-950', 'font-bold');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'font-semibold', 'border', 'border-gray-800');
            });
            event.target.classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
            event.target.classList.add('bg-yellow-500', 'text-gray-950', 'font-bold');

            const items = document.querySelectorAll('.card-item');
            items.forEach(item => {
                if (category === 'all' || item.dataset.category === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function filterPrompts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.card-item');
            items.forEach(item => {
                let title = item.dataset.title.toLowerCase();
                if (title.includes(input)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
