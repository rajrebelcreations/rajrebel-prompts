<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RajRebel Creations | AI Prompts</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;color:#d1d5db}
main{max-width:900px;margin:auto;padding:18px}
input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #0001}
.poster{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e5e7eb}
.card h2{font-size:18px;padding:0 14px}
button{border:0;border-radius:10px;background:#087eae;color:white;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.card button{display:block;margin:12px 14px 16px;width:calc(100% - 28px)}
.details{display:none;padding:0 14px 16px}
.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:12px;border-radius:8px;font-size:14px}
.copy{background:#16834a;width:100%;margin:8px 0!important}
footer{text-align:center;padding:25px;color:#667085}
</style>
</head>
<body>
<header>
<h1>RajRebel Creations</h1>
<p>AI Photo Prompts • Video Prompts • Editing Ideas</p>
</header>
<main>
<input id="search" placeholder="Search prompts..." oninput="searchCards()">
<div class="grid" id="gallery"></div>
</main>
<footer>© RajRebel Creations</footer>
<script>
const prompts = [
{
title:"AI Portrait Prompt",
image:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=700",
prompt:"Create a high-quality photorealistic portrait using the uploaded reference photo. Preserve the person's exact identity, facial features, hairstyle, skin tone and natural appearance. Use clean lighting, sharp details and a professional background."
},
{
title:"Cinematic Photo Prompt",
image:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700",
prompt:"Create a cinematic, photorealistic portrait from the uploaded reference image. Keep the same person, face, hairstyle, clothing and body proportions. Use natural colors, detailed textures, balanced lighting and high resolution."
}
];
function render(){
document.getElementById("gallery").innerHTML=prompts.map((p,i)=>`
<article class="card" data-title="${p.title.toLowerCase()}">
<img class="poster" src="${p.image}" alt="${p.title}">
<h2>${p.title}</h2>
<button onclick="toggle(${i})">Prompt</button>
<div class="details" id="details${i}">
<div class="prompt" id="prompt${i}"></div>
<button class="copy" onclick="copyPrompt(${i})">Copy Prompt</button>
</div>
</article>`).join("");
prompts.forEach((p,i)=>document.getElementById("prompt"+i).textContent=p.prompt);
}
function toggle(i){
const el=document.getElementById("details"+i);
el.style.display=el.style.display==="block"?"none":"block";
}
async function copyPrompt(i){
const text=prompts[i].prompt;
try{
await navigator.clipboard.writeText(text);
alert("Prompt copied!");
}catch(e){
const area=document.createElement("textarea");
area.value=text;document.body.appendChild(area);
area.select();document.execCommand("copy");area.remove();
alert("Prompt copied!");
}
}
function searchCards(){
const q=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".card").forEach(card=>{
card.style.display=card.dataset.title.includes(q)?"block":"none";
});
}
render();
</script>
</body>
</html>
