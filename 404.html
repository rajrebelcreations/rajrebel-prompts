<script>
  // A new prompt's own page (/p/ID/) is made a few minutes after posting.
  // Until then, send the visitor to the same prompt on the main site so the link always works.
  (function () {
    var m = location.pathname.match(/^\/p\/([^\/]+)\/?/);
    if (m && m[1] !== "img") { location.replace("/?post=" + encodeURIComponent(decodeURIComponent(m[1]))); return; }
  })();
</script>
